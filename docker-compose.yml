# Local Postgres + PostGIS for development: `docker compose up -d db`
# Then in backend/.env: DATABASE_URL=postgresql+psycopg://dristhi:dristhi@127.0.0.1:5432/dristhi
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dristhi
      POSTGRES_PASSWORD: dristhi
      POSTGRES_DB: dristhi
    ports:
      - "5432:5432"
    volumes:
      - dristhi-db:/var/lib/postgresql/data

volumes:
  dristhi-db:
