<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attendee pass sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#0B5E52}a:hover{color:#08443B}
</style>
</helmet>
<div style="box-sizing: border-box; min-height: 100vh; background: #E8EBE5; padding: 40px; font-family: Inter, Arial, sans-serif; color: #14202E; display: flex; gap: 32px; align-items: flex-start; overflow-x: auto">

<!-- 1. Pass found: the page /pass?c=... after scanning -->
<figure style="margin: 0; flex: none; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 13px; font-weight: 600; color: #3B4655">1 · After scanning the QR (/pass?c=…)</figcaption>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 2px 12px rgba(20, 32, 46, 0.12)">
<header style="padding: 24px 20px 0; display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border-radius: 10px; background: #0E7C6B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCFCFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
<span style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 18px; font-weight: 600">Dristhi</span>
</header>
<main style="flex: 1; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 24px">
<section aria-label="Your event" style="background: #0F1B2A; color: #EEF1EC; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #5CC9B0">Your pass</span>
<span style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 24px; font-weight: 600; line-height: 1.2">[Event name]</span>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #B8C4CC">
<span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>[Venue], [City]</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>[Date] · gates open [time]</span>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.5px">Hi Priya</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3B4655">This pass belongs to <strong style="font-weight: 600; color: #14202E; white-space: nowrap">+91 •••••• 4821</strong>. To open it, we’ll text a code to that number.</p>
</div>
<ul style="list-style: none; margin: 0; padding: 16px; background: #FCFCFA; border: 1px solid #E3E6E0; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; color: #3B4655">
<li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1-4.8A8 8 0 1 1 21 12z"/></svg>Ask for medical help or report a lost item</li>
<li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Find the nearest washroom, water or exit</li>
<li style="display: flex; gap: 10px; align-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>Get updates from the organisers</li>
</ul>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" style="font: inherit; font-size: 16px; font-weight: 600; color: #FCFCFA; background: #0E7C6B; border: 0; border-radius: 12px; min-height: 52px; cursor: pointer">Continue</button>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5B6675; text-align: center">Not your number? Show this screen at any help desk.</p>
</div>
</main>
</div>
</figure>

<!-- 2. Confirm the number on the pass -->
<figure style="margin: 0; flex: none; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 13px; font-weight: 600; color: #3B4655">2 · Confirm the number</figcaption>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 2px 12px rgba(20, 32, 46, 0.12)">
<header style="padding: 20px 12px 0; display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #3B4655; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<span style="font-size: 13px; color: #5B6675; padding-right: 12px">Step 1 of 2</span>
</header>
<main style="flex: 1; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.5px">Confirm your number</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3B4655">Type the phone number on your pass. It ends in <strong style="font-weight: 600; color: #14202E">4821</strong>.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: #3B4655">Phone number
<div style="display: flex; align-items: stretch; background: #FCFCFA; border: 2px solid #0E7C6B; border-radius: 12px; overflow: hidden">
<span style="display: flex; align-items: center; padding: 0 14px; font-size: 17px; font-weight: 500; color: #3B4655; background: #ECEFE9">+91</span>
<input type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit mobile number" value="98765 4821" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; font: inherit; font-size: 18px; font-weight: 500; letter-spacing: 0.5px; color: #14202E; background: transparent; border: 0; padding: 0 14px">
</div></label>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" style="font: inherit; font-size: 16px; font-weight: 600; color: #FCFCFA; background: #0E7C6B; border: 0; border-radius: 12px; min-height: 52px; cursor: pointer">Send code by SMS</button>
<p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5B6675; text-align: center">Protected by reCAPTCHA. We only use your number to open this pass.</p>
</div>
</main>
</div>
</figure>

<!-- 3. Enter the SMS code -->
<figure style="margin: 0; flex: none; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 13px; font-weight: 600; color: #3B4655">3 · Enter the SMS code</figcaption>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 2px 12px rgba(20, 32, 46, 0.12)">
<header style="padding: 20px 12px 0; display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: #3B4655; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
<span style="font-size: 13px; color: #5B6675; padding-right: 12px">Step 2 of 2</span>
</header>
<main style="flex: 1; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.5px">Enter the code</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3B4655">We sent a 6-digit code to <strong style="font-weight: 600; color: #14202E; white-space: nowrap">+91 •••••• 4821</strong>.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 500; color: #3B4655">SMS code
<input inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="3 9 1 5" style="box-sizing: border-box; height: 56px; font: inherit; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 10px; text-align: center; color: #14202E; background: #FCFCFA; border: 2px solid #0E7C6B; border-radius: 12px"></label>
<p style="margin: 0; font-size: 14px; color: #5B6675">Didn’t get it? <span style="color: #3B4655">Resend in 0:42</span></p>
<p style="margin: 0; padding: 14px 16px; background: #E3F1EC; color: #0B5E52; border-radius: 12px; font-size: 13px; line-height: 1.5">This links your pass to this phone. It won’t open on another phone unless staff reset it.</p>
<div style="flex: 1"></div>
<button type="button" style="font: inherit; font-size: 16px; font-weight: 600; color: #FCFCFA; background: #0E7C6B; border: 0; border-radius: 12px; min-height: 52px; cursor: pointer">Verify and open my pass</button>
</main>
</div>
</figure>

<!-- 4. Error: pass already in use (409). Same layout for the other errors. -->
<figure style="margin: 0; flex: none; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 13px; font-weight: 600; color: #3B4655">4 · Can’t open the pass (example: already in use)</figcaption>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; display: flex; flex-direction: column; overflow: hidden; border-radius: 28px; box-shadow: 0 2px 12px rgba(20, 32, 46, 0.12)">
<header style="padding: 24px 20px 0; display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border-radius: 10px; background: #0E7C6B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCFCFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
<span style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 18px; font-weight: 600">Dristhi</span>
</header>
<main style="flex: 1; padding: 40px 20px 24px; display: flex; flex-direction: column; gap: 24px">
<div style="width: 56px; height: 56px; border-radius: 16px; background: #FBE4DA; color: #9A3412; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; font-size: 12px; font-weight: 600; color: #9A3412; background: #FBE4DA; border-radius: 6px; padding: 3px 8px">Pass in use</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: -0.5px">This pass is open on another phone</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3B4655">A pass works on one phone only. If that wasn’t you, go to any help desk with photo ID and staff will reset it.</p>
</div>
<section aria-labelledby="help-h" style="background: #FCFCFA; border: 1px solid #E3E6E0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 id="help-h" style="margin: 0; font-size: 14px; font-weight: 600">Help desks</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #3B4655">
<li>[Help desk 1] · near [landmark]</li>
<li>[Help desk 2] · near [landmark]</li>
</ul>
</section>
<div style="flex: 1"></div>
<button type="button" style="font: inherit; font-size: 16px; font-weight: 500; color: #14202E; background: #FCFCFA; border: 1px solid #D3D9D1; border-radius: 12px; min-height: 52px; cursor: pointer">Try again</button>
</main>
</div>
</figure>

</div>
</x-dc>

</body>
</html>
